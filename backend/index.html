<form id="newsletterForm">
    <input type="email" id="emailInput" placeholder="Digite seu melhor e-mail" required />
    <button type="submit">Inscrever-se</button>
</form>

<script>
    document.getElementById('newsletterForm').addEventListener('submit', async (event) => {
        event.preventDefault(); // Evita que a página recarregue

        const emailDigitado = document.getElementById('emailInput').value;

        try {
            const response = await fetch('http://localhost:3000/newsletter/cadastrar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: emailDigitado })
            });

            const resultado = await response.json();

            if (response.ok) {
                alert('Inscrição feita com sucesso! Verifique sua caixa de entrada.');
                document.getElementById('emailInput').value = ''; // Limpa o campo
            } else {
                alert(`Erro: ${resultado.message}`);
            }
        } catch (error) {
            console.error('Erro de conexão:', error);
            alert('Não foi possível conectar ao servidor do backend.');
        }
    });
</script>
